name: emergency_path_finder
description: Real-time emergency exit detection and navigation app using ML.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera and on-device inference
  camera: ^0.10.5+5
  tflite_flutter: ^0.10.4

  # Device orientation for the navigation arrow
  sensors_plus: ^4.0.2

  # Torch, permissions, UI
  permission_handler: ^11.0.1
  torch_light: ^1.0.0
  cupertino_icons: ^1.0.6

  # Frame conversion
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true

  # The .tflite model is produced by `python training/train_exit_detector.py`
  # and copied here. It is deliberately not committed - see the README.
  assets:
    - assets/models/
