[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emergency-path-finder"
version = "1.0.0"
description = "Offline emergency exit detection and arrow-based navigation guidance"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sarthak Doshi" }]
keywords = ["computer-vision", "emergency", "navigation", "yolov8", "opencv"]
dependencies = [
    "numpy>=1.23,<2.0",
    "opencv-python>=4.7,<5.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
train = [
    "ultralytics>=8.1,<9.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "roboflow>=1.1",
]
dev = ["pytest>=7.4"]

[project.scripts]
emergency-path-finder = "emergency_path_finder.cli:main"

[tool.setuptools]
packages = ["emergency_path_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
